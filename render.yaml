# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Secrets (sync: false) are entered in the Render dashboard when the Blueprint is created; never commit them.
# Run exactly ONE worker (here or locally, never both): two workers would act on the same signals twice.
services:
  # The bot: discovery, wallet listener, migration strategy, position management.
  - type: worker
    name: coinbit-worker
    runtime: node
    plan: starter
    region: ohio # same AWS region as the Neon database (us-east-2)
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_WSS_URL
        sync: false
      # Optional, add later in the worker's Environment tab on Render when you have them:
      #   TRADER_PRIVATE_KEY (live trading), PUMPPORTAL_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
      #   SOLANA_RPC_FALLBACK_URLS. Saving env vars on Render restarts the worker automatically.
      # Defaults are safe; change here or in the Render dashboard. Anything from .env.example can be added.
      - key: TRADING_MODE
        value: paper
      - key: MIGRATION_MODE
        value: paper
      - key: RPC_MAX_RPS
        value: "10"
      - key: DISCOVERY_INTERVAL_MIN
        value: "15"

  # The dashboard (Next.js). Reads the same database; never needs the trading key.
  - type: web
    name: coinbit-dashboard
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
